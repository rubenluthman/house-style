name: rules

on:
  push:
    branches: [main]
    paths:
      - "HouseStyle/**"
      - "tests/**"
      - "scripts/**"
      - "**.md"
      - ".vale.ini"
      - ".github/workflows/rules.yml"
  pull_request:
    paths:
      - "HouseStyle/**"
      - "tests/**"
      - "scripts/**"
      - "**.md"
      - ".vale.ini"
      - ".github/workflows/rules.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Vale 3.26.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o vale.tar.gz https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz
          echo "22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
      - name: Rule tests
        run: scripts/test_rules.sh
