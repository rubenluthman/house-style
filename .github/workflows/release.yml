name: release

# Pushing a v* tag is the release decision. The workflow_dispatch path runs
# every step except publishing, so the workflow can be tested without a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# No cancel-in-progress: this workflow publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Find the version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
            version="${tag#v}"
          else
            # Test run: use the newest released heading.
            version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
            tag="v$version"
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Require an annotated tag
        if: github.event_name == 'push'
        run: |
          # Checkout may fetch only the commit, so fetch the tag object itself.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -a"
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with content"
            exit 1
          fi
          cat notes.md
      - name: Install Vale 3.26.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o vale.tar.gz https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz
          echo "22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Rule tests
        run: scripts/test_rules.sh
      - name: Build the archive
        run: scripts/build_release.sh
      - name: Check the archive layout
        run: |
          tops=$(unzip -Z1 dist/HouseStyle.zip | cut -d/ -f1 | sort -u)
          if [ "$tops" != "HouseStyle" ]; then
            echo "::error::Archive must hold exactly one top-level HouseStyle/ folder, found: $tops"
            exit 1
          fi
      - name: Scan the archive
        run: scripts/commit-checks scan-archive dist/HouseStyle.zip
      - name: Load the archive like a consuming repository
        run: scripts/test_archive.sh
      - name: Upload the archive as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HouseStyle
          path: dist/HouseStyle.zip
          if-no-files-found: error
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags and their downloads never change once projects pin them.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; not overwriting it"
            exit 1
          fi
          gh release create "$TAG" dist/HouseStyle.zip --title "$TAG" --notes-file notes.md --verify-tag
